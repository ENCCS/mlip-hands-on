name: Sphinx lesson checks

on:
  push:
    branches: [main, 'lesson/minimal-md-cli']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out lesson source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install lesson dependencies
        run: python -m pip install -r requirements.txt
      - name: Check shell and Python examples
        run: |
          git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n
          git ls-files -z '*.py' | xargs -0 -r python -m py_compile
      - name: Check publication privacy and execution policy
        run: python maintainer/check-public-content.py
      - name: Build lesson without executing GPU cells
        run: make html
      - name: Upload HTML for review
        uses: actions/upload-artifact@v4
        with:
          name: lesson-html
          path: _build/html/
          if-no-files-found: error
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _build/html/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/lesson/minimal-md-cli'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/minimal-md-cli/
    steps:
      - name: Check out the unchanged main lesson
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install main lesson dependencies
        run: python -m pip install -r requirements.txt
      - name: Build main at the site root
        run: make html
      - name: Add this run's reviewed branch HTML at a preview subpath
        uses: actions/download-artifact@v4
        with:
          name: lesson-html
          path: _build/html/preview/minimal-md-cli
      - name: Verify both entry points
        run: test -f _build/html/index.html && test -f _build/html/preview/minimal-md-cli/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload composite GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _build/html/
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
