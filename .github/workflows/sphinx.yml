name: Sphinx lesson checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out lesson source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install lesson dependencies
        run: python -m pip install -r requirements.txt
      - name: Check shell and Python examples
        run: |
          git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n
          git ls-files -z '*.py' | xargs -0 -r python -m py_compile
      - name: Check publication privacy and execution policy
        run: python scripts/check-public-content.py
      - name: Build lesson with offline CSV cells only
        run: make html
      - name: Upload HTML for review
        uses: actions/upload-artifact@v4
        with:
          name: lesson-html
          path: _build/html/
          if-no-files-found: error

# Pages deployment is intentionally absent. A private ENCCS repository may
# publish a public site, or may not be eligible for Pages under its plan.
# Confirm organization policy and intended visibility before adding a deploy job.
