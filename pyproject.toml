[project]
name = "mlip-hands-on"
version = "0.1.0"
description = "ENCCS MyST lesson on MACE molecular dynamics with ALCHEMI and LAMMPS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "sphinx>=8.2.3,<9",
  "sphinx-lesson==0.8.20",
  "sphinx-design==0.7.0",
  "sphinx-evita @ https://github.com/ENCCS/sphinx-evita/archive/refs/tags/v0.1.0b1.zip",
  "furo==2025.12.19",
  "myst-nb>=1.2,<2",
]

[dependency-groups]
notebook = [
  "jupyterlab>=4,<5",
  "jupytext>=1.17,<2",
  "matplotlib>=3.8,<4",
]
dev = [
  { include-group = "notebook" },
  "sphinx-autobuild>=2024.10",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = false
